<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Гимназия</title>
<script src="https://st.max.ru/js/max-web-app.js"></script>
<style>
  :root { --bg: #f2f3f5; --card: #fff; --text: #16181d; --muted: #6b7280; --line: #e5e7eb; --accent: #2b6ef6; --accent-weak: #e8f0ff; --warn: #b45309; --warn-weak: #fff4e0; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1115; --card: #1a1d23; --text: #eceef2; --muted: #9aa1ad; --line: #2a2e36; --accent: #5b8ff9; --accent-weak: #1d2a44; --warn: #f0b35a; --warn-weak: #3a2a12; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-text-size-adjust: 100%; }
  header { position: sticky; top: 0; z-index: 5; background: var(--card); border-bottom: 1px solid var(--line); padding: 10px 16px 0; }
  .head { display: flex; align-items: center; gap: 10px; }
  .head img { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; background: var(--line); }
  .head .t { font-weight: 600; font-size: 16px; line-height: 1.2; flex: 1; min-width: 0; }
  .head button { border: 0; background: var(--accent); color: #fff; border-radius: 16px; padding: 6px 12px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  nav { display: flex; gap: 4px; margin-top: 8px; }
  nav button { flex: 1; border: 0; background: none; color: var(--muted); font: inherit; font-weight: 600; padding: 10px 0; border-bottom: 2px solid transparent; cursor: pointer; }
  nav button.on { color: var(--accent); border-bottom-color: var(--accent); }
  main { padding: 12px 12px 32px; max-width: 720px; margin: 0 auto; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 16px 4px 8px; font-weight: 600; }
  h2:first-child { margin-top: 4px; }
  .card { background: var(--card); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; }
  .date { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .text { white-space: pre-wrap; word-wrap: break-word; }
  .text.clip { max-height: 9.5em; overflow: hidden; -webkit-mask-image: linear-gradient(#000 70%, transparent); mask-image: linear-gradient(#000 70%, transparent); }
  .text a { color: var(--accent); }
  .text .h { font-weight: 700; font-size: 1.05em; }
  .more { border: 0; background: none; color: var(--accent); font: inherit; padding: 4px 0 0; cursor: pointer; }
  .gallery { display: flex; gap: 6px; overflow-x: auto; margin: 8px -14px 0; padding: 0 14px; scroll-snap-type: x mandatory; scrollbar-width: none; }
  .gallery::-webkit-scrollbar { display: none; }
  .gallery .ph { flex: 0 0 auto; width: 100%; scroll-snap-align: start; position: relative; }
  .gallery.many .ph { width: 82%; }
  .gallery.thumbs .ph { width: 72px; }
  .gallery.thumbs .ph img { height: 72px; }
  .ph img { width: 100%; max-height: 420px; object-fit: cover; border-radius: 10px; display: block; background: var(--line); cursor: zoom-in; }
  .ph.video::after { content: "▶"; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 34px; color: #fff; text-shadow: 0 2px 10px rgba(0,0,0,.6); pointer-events: none; }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .link { border: 0; background: none; color: var(--accent); font: inherit; font-size: 13px; padding: 0; cursor: pointer; }
  .muted { color: var(--muted); font-size: 13px; }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 10px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chips button { flex: 0 0 auto; border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 16px; padding: 6px 12px; font: inherit; font-size: 14px; cursor: pointer; }
  .chips button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .sched img { width: 100%; border-radius: 10px; display: block; margin-top: 8px; cursor: zoom-in; background: var(--line); }
  .file { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
  .file:first-of-type { border-top: 0; }
  .file .ic { width: 34px; height: 34px; border-radius: 8px; background: var(--accent-weak); color: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; }
  .btn-wide { width: 100%; border: 0; background: var(--accent-weak); color: var(--accent); border-radius: 10px; padding: 10px; font: inherit; font-weight: 600; cursor: pointer; }
  .btn-wide.notify { margin-bottom: 10px; }
  .badge { display: inline-block; background: var(--warn-weak); color: var(--warn); border-radius: 8px; padding: 1px 8px; font-size: 12px; font-weight: 600; margin-left: 6px; }
  .meal-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
  .meal-head b { font-size: 16px; }
  .dish { display: flex; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
  .dish:first-of-type { border-top: 0; }
  .dish .nm { flex: 1; min-width: 0; }
  .dish .pr { white-space: nowrap; font-variant-numeric: tabular-nums; }
  .chips.wrap { flex-wrap: wrap; overflow: visible; }
  .chips.wrap button { padding: 5px 10px; font-size: 13px; min-width: 44px; }
  .tt-day { padding: 8px 0 4px; border-top: 1px solid var(--line); }
  .tt-title + .tt-day { border-top: 0; }
  .tt-day-h { font-weight: 600; margin-bottom: 4px; display: flex; align-items: center; flex-wrap: wrap; gap: 4px; }
  .tt-day-h .badge { margin-left: 2px; }
  .tt { list-style: none; margin: 0; padding: 0; }
  .tt li { display: flex; gap: 8px; padding: 3px 0; align-items: baseline; }
  .tt .ln { width: 16px; flex: 0 0 auto; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
  .tt .ls { flex: 1; min-width: 0; }
  .tt .lt { flex: 0 0 auto; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .tt li.chg .ls { color: var(--warn); font-weight: 600; }
  .tt-title { font-size: 17px; font-weight: 700; margin-bottom: 2px; }
  details.fold summary { cursor: pointer; font-weight: 600; list-style: none; display: flex; align-items: center; justify-content: space-between; }
  details.fold summary::-webkit-details-marker { display: none; }
  details.fold summary::after { content: '▾'; color: var(--muted); transition: transform .15s; }
  details.fold[open] summary::after { transform: rotate(180deg); }
  .fold-body { padding-top: 10px; }
  .fold-body .card { background: none; border-radius: 0; padding: 10px 0 4px; margin: 0; border-top: 1px solid var(--line); }
  .fold-body .chips { padding-bottom: 6px; }
  .fold-body .btn-wide.notify:last-child { margin-bottom: 0; }
  .fold-body > .card:first-child, .fold-body > .chips + .card { border-top: 0; }
  .now { border-left: 3px solid var(--accent); }
  .now .big { font-size: 16px; font-weight: 600; }
  .now .sub { margin-top: 2px; }
  .info ul { margin: 4px 0 8px; padding-left: 18px; }
  .info li { margin: 4px 0; }
  .info h3 { font-size: 14px; margin: 10px 0 4px; }
  .kv { display: flex; justify-content: space-between; gap: 10px; padding: 5px 0; border-top: 1px solid var(--line); }
  .kv:first-child { border-top: 0; }
  .kv .muted { text-align: right; }
  details.sub { border-top: 1px solid var(--line); padding: 8px 0; }
  details.sub:first-child { border-top: 0; padding-top: 0; }
  details.fold details.sub summary { cursor: pointer; font-weight: 600; list-style: none; display: block; text-align: left; }
  details.fold details.sub summary::after { content: none; }
  details.sub .fold-body { padding: 6px 0 0 14px; }
  details.sub summary::-webkit-details-marker { display: none; }
  details.sub summary::before { content: '›'; display: inline-block; width: 14px; color: var(--muted); transition: transform .15s; }
  details.sub[open] summary::before { transform: rotate(90deg); }
  .info p { margin: 4px 0 8px; }
  .ev { display: flex; gap: 10px; padding: 6px 0; border-top: 1px solid var(--line); }
  .ev:first-child { border-top: 0; }
  .ev .d { flex: 0 0 64px; color: var(--muted); font-size: 13px; }
  .club { padding: 7px 0; border-top: 1px solid var(--line); }
  .club:first-child { border-top: 0; }
  .club .t { font-variant-numeric: tabular-nums; font-weight: 600; }
  .hot { background: var(--warn-weak); border-radius: 10px; padding: 10px 12px; margin: 4px 0 10px; }
  .hot a, .info a.tel { color: var(--accent); font-weight: 600; text-decoration: none; }
  .tests { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); }
  .btn-row { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .empty { text-align: center; color: var(--muted); padding: 32px 16px; }
  .foot { text-align: center; color: var(--muted); font-size: 12px; margin-top: 16px; }
  #viewer { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.94); display: none; overflow: auto; -webkit-overflow-scrolling: touch; touch-action: pan-x pan-y pinch-zoom; }
  #viewer.on { display: block; }
  #viewer img { display: block; width: 100%; height: auto; min-height: 100%; object-fit: contain; }
  #viewer.zoom img { width: 220%; max-width: none; min-height: 0; }
  #viewer .x { position: fixed; top: max(10px, env(safe-area-inset-top)); right: 12px; width: 38px; height: 38px; border-radius: 50%; border: 0; background: rgba(255,255,255,.18); color: #fff; font-size: 20px; cursor: pointer; }
  #viewer .hint { position: fixed; bottom: max(12px, env(safe-area-inset-bottom)); left: 0; right: 0; text-align: center; color: rgba(255,255,255,.7); font-size: 12px; pointer-events: none; }
</style>
</head>
<body>
<header>
  <div class="head"><img id="logo" alt="" hidden><div class="t" id="title">Гимназия</div><button id="sub" hidden>Подписаться</button></div>
  <nav><button data-tab="schedule" class="on">Мой день</button><button data-tab="info">Гимназисту</button><button data-tab="news">Новости</button></nav>
</header>
<main id="main"><div class="empty">Загрузка…</div></main>
<div id="viewer"><img alt=""><button class="x" aria-label="Закрыть">✕</button><div class="hint">Нажмите на картинку, чтобы увеличить</div></div>
<script>
(function () {
  const W = window.WebApp || null;
  const $ = (s) => document.querySelector(s);
  const main = $('#main');
  let data = null, tab = 'schedule', cls = null, menuDay = null, foodGroup = null, myClasses = [], folds = {}, infoGrade = null, clubDay = null, evGrade = null, evAll = false;
  try { const t = localStorage.getItem('miniapp.tab'); tab = ['news', 'info'].includes(t) ? t : 'schedule'; cls = localStorage.getItem('miniapp.class'); foodGroup = localStorage.getItem('miniapp.food'); myClasses = JSON.parse(localStorage.getItem('miniapp.myclasses') || '[]'); } catch (e) { /* хранилище недоступно */ }

  function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
  function safeUrl(u) { return /^https?:\/\//i.test(u || '') ? u : null; }

  // Оформление поста: диапазоны markup в единицах UTF-16 — строки JS тоже в UTF-16, так что режем прямо по ним
  function render(text, markup) {
    const marks = (markup || []).filter((m) => m && m.length > 0);
    const cuts = new Set([0, text.length]);
    marks.forEach((m) => { cuts.add(m.from); cuts.add(m.from + m.length); });
    const pts = [...cuts].filter((x) => x >= 0 && x <= text.length).sort((a, b) => a - b);
    let out = '';
    for (let i = 0; i < pts.length - 1; i++) {
      const a = pts[i], b = pts[i + 1];
      let s = esc(text.slice(a, b));
      const on = marks.filter((m) => m.from <= a && m.from + m.length >= b);
      let link = null;
      on.forEach((m) => {
        if (m.type === 'strong') s = '<b>' + s + '</b>';
        else if (m.type === 'emphasized') s = '<i>' + s + '</i>';
        else if (m.type === 'underline') s = '<u>' + s + '</u>';
        else if (m.type === 'strikethrough') s = '<s>' + s + '</s>';
        else if (m.type === 'monospaced' || m.type === 'code') s = '<code>' + s + '</code>';
        else if (m.type === 'heading') s = '<span class="h">' + s + '</span>';
        else if (m.type === 'link' && safeUrl(m.url)) link = m.url;
      });
      if (link) s = '<a href="' + esc(link) + '" data-ext="1">' + s + '</a>';
      out += s;
    }
    // голые ссылки в тексте
    return out.replace(/(^|[\s(])(https?:\/\/[^\s<]+[^\s<.,;:!?)»])/g, (m, p, u) => p + '<a href="' + u + '" data-ext="1">' + u + '</a>');
  }

  function fmtDate(ts) {
    const d = new Date(ts), now = new Date();
    const day = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
    const diff = Math.round((day(now) - day(d)) / 864e5);
    const time = d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
    if (diff === 0) return 'сегодня, ' + time;
    if (diff === 1) return 'вчера, ' + time;
    return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', ...(d.getFullYear() !== now.getFullYear() ? { year: 'numeric' } : {}) }) + ', ' + time;
  }

  function openUrl(u) {
    if (!u) return;
    if (/^https:\/\/max\.ru\//.test(u) && W && W.openMaxLink) return W.openMaxLink(u);
    if (W && W.openLink) return W.openLink(u);
    window.open(u, '_blank', 'noopener');
  }

  function post(p, clip, compact) {
    const media = (p.images || []).map((src) => '<div class="ph"><img loading="lazy" src="' + esc(src) + '" alt="" data-full="' + esc(src) + '"></div>')
      .concat((p.videos || []).map((src) => '<div class="ph video"><img loading="lazy" src="' + esc(src) + '" alt="Видео" data-post="' + esc(p.url || '') + '"></div>'));
    const long = clip && p.text.length > 420;
    return '<div class="card">' +
      '<div class="date">' + fmtDate(p.ts) + (p.badge ? '<span class="badge">' + esc(p.badge) + '</span>' : '') + '</div>' +
      (p.text ? '<div class="text' + (long ? ' clip' : '') + '">' + render(p.text, p.markup) + '</div>' + (long ? '<button class="more">Читать полностью</button>' : '') : '') +
      (media.length ? '<div class="gallery' + (compact ? ' thumbs' : media.length > 1 ? ' many' : '') + '">' + media.join('') + '</div>' : '') +
      (p.pdf ? '<div class="row"><button class="btn-wide" data-open="' + esc(p.pdf) + '">📄 Изменения (PDF)</button></div>' : '') +
      (p.url ? '<div class="row"><button class="link" data-open="' + esc(p.url) + '">Открыть в канале' + ((p.videos || []).length ? ' (видео)' : '') + '</button>' + (media.length > 1 ? '<span class="muted">· ' + media.length + ' фото</span>' : '') + '</div>' : '') +
      '</div>';
  }

  const WD = ['Понедельник', 'Вторник', 'Среда', 'Четверг', 'Пятница', 'Суббота', 'Воскресенье'];
  const MON_GEN = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
  const MON_PREP = ['январе', 'феврале', 'марте', 'апреле', 'мае', 'июне', 'июле', 'августе', 'сентябре', 'октябре', 'ноябре', 'декабре'];
  const gradeOf = (k) => parseInt(k, 10) || 0;
  const dmy = (iso) => { const d = new Date(iso + 'T00:00:00'); return d.getDate() + ' ' + MON_GEN[d.getMonth()]; };
  // каникулы и праздники из календарного графика; дополнительные каникулы — только для 1 классов
  function holidaysFor(k) { return (((data.school || {}).year || {}).holidays || []).filter((h) => !h.first_only || gradeOf(k) === 1); }
  function isOff(d, k) {
    const iso = isoDay(d), y = (data.school || {}).year || {};
    if (d.getDay() % 6 === 0) return true;
    return holidaysFor(k).some((h) => h.start <= iso && iso <= h.end) || (y.offdays || []).some((o) => o.date === iso);
  }
  // 5 ближайших учебных дней: с сегодняшнего (после 15:00 — со следующего), без выходных, каникул и праздников
  function schoolDays(k) {
    const out = [], d = new Date();
    if (d.getHours() >= 15) d.setDate(d.getDate() + 1);
    for (let i = 0; out.length < 5 && i < 120; i++) { if (!isOff(d, k)) out.push(new Date(d)); d.setDate(d.getDate() + 1); }
    return out;
  }
  // уроки класса на день: из изменений, если они есть, иначе основное расписание → [[номер, предмет, кабинет, изменён]]
  function dayLessons(k, d) {
    const tt = data.timetable || {}, iso = isoDay(d), wd = (d.getDay() + 6) % 7;
    const ch = (((tt.changes || {})[iso] || {}).classes || {})[k];
    if (ch) return ch.filter((l) => l[1]);
    return (((tt.main || {})[wd] || {})[k] || []).map((l) => [l[0], l[1], l[2], false]).filter((l) => l[1]);
  }
  function bell(n) {
    const m = String(((data.timetable || {}).bells || [])[n - 1] || '').match(/(\d{1,2}):(\d{2})\D+(\d{1,2}):(\d{2})/);
    return m ? [m[1] * 60 + +m[2], m[3] * 60 + +m[4], m[1] + ':' + m[2]] : null;
  }
  function teacherOf(k) {
    const t = (data.school || {}).teachers || {};
    if (t[k]) return t[k];
    const same = Object.keys(t).filter((x) => gradeOf(x) === gradeOf(k));
    return same.length === 1 ? t[same[0]] : null;   // 10 тех / 10 ен — один 10 А на сайте
  }
  function lessonText(l) { return esc(l[1]) + (l[2] ? ', каб. ' + esc(l[2]) : ''); }
  // «Сейчас»: идёт урок / перемена / первый урок / уроки закончились
  function nowLine(k) {
    const d = new Date(), mins = d.getHours() * 60 + d.getMinutes();
    if (isOff(d, k)) return null;
    const ls = dayLessons(k, d).map((l) => ({ l, b: bell(l[0]) })).filter((x) => x.b);
    if (!ls.length) return null;
    const cur = ls.find((x) => x.b[0] <= mins && mins < x.b[1]);
    const next = ls.find((x) => x.b[0] > mins);
    if (cur) {
      return '<div class="big">Идёт ' + cur.l[0] + '-й урок: ' + lessonText(cur.l) + '</div><div class="muted sub">до звонка ' + (cur.b[1] - mins) + ' мин' +
        (next ? ' · дальше ' + next.l[0] + '-й: ' + lessonText(next.l) + ' в ' + next.b[2] : ' · это последний урок') + '</div>';
    }
    if (next && next === ls[0]) {
      return '<div class="big">Первый урок в ' + next.b[2] + '</div><div class="muted sub">' + next.l[0] + '-й: ' + lessonText(next.l) + ' · через ' + fmtMin(next.b[0] - mins) + '</div>';
    }
    if (next) return '<div class="big">Перемена</div><div class="muted sub">' + next.l[0] + '-й урок в ' + next.b[2] + ' (через ' + (next.b[0] - mins) + ' мин): ' + lessonText(next.l) + '</div>';
    return '<div class="big">Уроки на сегодня закончились</div>';
  }
  function fmtMin(m) { return m >= 60 ? Math.floor(m / 60) + ' ч ' + (m % 60) + ' мин' : m + ' мин'; }
  function viewNow() {
    const rows = myClasses.map((k) => { const x = nowLine(k); return x ? (myClasses.length > 1 ? '<div class="muted">' + esc(classLabel(k)) + '</div>' : '') + x : ''; }).filter(Boolean);
    return rows.length ? '<div class="card now" id="now">' + rows.join('<div style="height:8px"></div>') + '</div>' : '';
  }
  function classLabel(k) { return (((data.timetable || {}).classes || []).find((c) => c.key === k) || {}).label || k; }
  // До каникул N дней и ближайшие нерабочие дни
  function viewCountdown() {
    const y = (data.school || {}).year;
    if (!y) return '';
    const today = isoDay(new Date()), k = myClasses[0] || '';
    const hol = holidaysFor(k).slice().sort((a, b) => a.start.localeCompare(b.start));
    const cur = hol.find((h) => h.start <= today && today <= h.end);
    let h = '';
    if (cur) h += '<div class="big">🏖 ' + esc(cur.name) + ' каникулы — до ' + dmy(cur.end) + '</div>';
    else {
      const nx = hol.find((x) => x.start > today);
      if (nx) {
        const days = Math.round((new Date(nx.start + 'T00:00:00') - new Date(today + 'T00:00:00')) / 864e5);
        h += '<div class="big">🏖 До ' + esc(nx.name.toLowerCase().replace(/\s*\(.*\)/, '').replace(/ие$/, 'их')) + ' каникул ' + days + ' ' + plural(days, 'день', 'дня', 'дней') + '</div>' +
          '<div class="muted sub">' + dmy(nx.start) + ' – ' + dmy(nx.end) + ' · ' + nx.days + ' ' + plural(nx.days, 'день', 'дня', 'дней') + '</div>';
      }
    }
    const lim = isoDay(new Date(Date.now() + 30 * 864e5));
    (y.offdays || []).filter((o) => o.date >= today && o.date <= lim).forEach((o) => {
      const d = new Date(o.date + 'T00:00:00');

      b += '<div class="chips wrap">' + grades.map((g) => '<button data-igrade="' + g + '"' + (+g === +infoGrade ? ' class="on"' : '') + '>' + g + ' кл.</button>').join('') + '</div>';
      const today = new Date(), cur = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0');
      const months = Object.keys((tests.grades || {})[String(infoGrade)] || {}).filter((m) => m >= cur).sort();
      b += months.length ? months.map((m) => '<h3>' + ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'][+m.slice(5) - 1] + '</h3><div>' +
        tests.grades[String(infoGrade)][m].map((x) => esc(x[0]) + (x[1] > 1 ? ' ×' + x[1] : '')).join(', ') + '</div>').join('') : '<div class="muted">До конца года контрольных по графику нет.</div>';
      b += '<div class="muted" style="margin-top:8px">В графике только месяцы — точные даты называет учитель.</div>';
    }
    b += '<h3>ГИА (9 и 11 классы)</h3>' + ul(tx.gia) + '<div class="btn-row">' + btn(tests.pdf, '📄 График оценочных процедур (PDF)') + btn(ln.gia, 'ВПР и ГИА на сайте гимназии') + '</div>';
    h += fold('i-tests', '📝 Контрольные и экзамены', b);
    // ---- правила
    h += '<h2>Правила</h2>';
    b = ul(tx.routine) + (page('rights') ? sub('Права и обязанности учащегося', blocksHtml(page('rights').blocks, page('rights').url)) : '');
    h += fold('i-routine', '📋 Распорядок, права и обязанности', b);
    if ((tx.uniform || []).length) h += fold('i-uniform', '👔 Школьная форма', ul(tx.uniform));
    if ((tx.devices || []).length) h += fold('i-devices', '📵 Телефоны и гаджеты', ul(tx.devices));
    if (page('visit')) h += fold('i-visit', '🚪 Посещение гимназии и пропуск', blocksHtml(page('visit').blocks, page('visit').url));
    if (page('chats') || (tx.chat_ethics || []).length) h += fold('i-chats', '💬 Чаты Сферума и этика общения', (page('chats') ? blocksHtml(page('chats').blocks) : '') + ((tx.chat_ethics || []).length ? '<h3>Этика общения в чатах</h3>' + ul(tx.chat_ethics) : '') + (page('chats') ? '<div class="btn-row">' + btn(page('chats').url, 'Открыть на сайте') + '</div>' : ''));
    // ---- кружки и мероприятия
    const clubs = sc.clubs || {}, evs = (sc.events || {}).items || [];
    if ((clubs.list || []).length || (clubs.week || []).length || evs.length) h += '<h2>Кружки и мероприятия</h2>';
    if ((clubs.list || []).length || (clubs.week || []).length) h += fold('i-clubs', '⚽ Кружки и секции', viewClubs());
    if (evs.length) h += fold('i-events', '🎉 Мероприятия', viewEvents());
    // ---- полезное
    h += '<h2>Полезное</h2>';
    if (page('cold')) h += fold('i-cold', '❄️ Актированные дни', '<div class="hot">Занятия идут при любой погоде. При −30 °C и ниже вести ли ребёнка в гимназию, решают родители; если ребёнок останется дома — сообщите классному руководителю.</div>' + blocksHtml(page('cold').blocks, page('cold').url));
    [['books', '📚 Учебники'], ['olymp', '🏆 Олимпиады и конференции'], ['paid', '💳 Платные услуги'], ['support', '🤝 Стипендии и меры поддержки']].forEach(([id, t]) => { if (page(id)) h += fold('i-' + id, t, blocksHtml(page(id).blocks, page(id).url)); });
    const faq = sc.faq || [];
    if (faq.length) h += fold('i-faq', '❓ Вопросы и ответы', faq.map((g) => (faq.length > 1 ? '<h3>' + esc(g.group) + '</h3>' : '') + g.items.map((q) => sub(q[0], '<p>' + esc(q[1]) + '</p>')).join('')).join('') +
      ((data.channel || {}).ask ? '<div class="btn-row"><button class="btn-wide" data-open="' + esc(data.channel.ask) + '">✉️ Не нашли ответ? Задать вопрос гимназии</button></div>' : ''));
    if ((tx.links || []).length) h += fold('i-links', '🔗 Полезные ссылки', tx.links.map((l) => '<div class="kv"><span><button class="link" style="font-size:15px" data-open="' + esc(l[1]) + '">' + esc(l[0]) + '</button>' + (l[2] ? '<div class="muted">' + esc(l[2]) + '</div>' : '') + '</span></div>').join(''));
    // ---- помощь
    const helpIds = ['infosec'].filter(page), chn = data.channel || {};
    if (tx.helpline || helpIds.length) {
      h += '<h2>Помощь и безопасность</h2>';
      const hl = String(tx.helpline || '').replace(/(8-800-[\d-]+)/, (m) => tel(m, m.replace(/-/g, '')));
      h += fold('i-help', '🆘 Если нужна помощь', (tx.helpline ? '<div class="hot">' + hl.replace(/^([^<]*)/, (m) => esc(m)) + '</div>' : '') +
        (chn.psy ? '<button class="btn-wide notify" data-open="' + esc(chn.psy) + '">💬 Написать психологу — конфиденциально</button>' +
          '<div class="muted" style="margin:-4px 0 10px">Сообщение уйдёт через бота гимназии. Его прочитают только педагог-психолог и администрация гимназии — ни одноклассники, ни учителя, ни общие чаты. Ответ придёт в чат с ботом.</div>' : '') +
        helpIds.map((id) => sub(page(id).title, blocksHtml(page(id).blocks, page(id).url))).join(''));
    }
    // ---- контакты
    const ct = tx.contacts;
    h += '<h2>Контакты</h2>';
    if (chn.ask) h += '<button class="btn-wide notify" data-open="' + esc(chn.ask) + '">✉️ Задать вопрос гимназии</button>';
    if (ct) h += fold('i-contacts', '📞 Телефоны и адрес', (ct.phones || []).map((p) => '<div class="kv"><span>' + esc(p[0]) + '</span>' + tel(p[1], p[2]) + '</div>').join('') +
      (ct.emails || []).map((e) => '<div class="kv"><span>Почта</span><a class="tel" href="mailto:' + esc(e) + '">' + esc(e) + '</a></div>').join('') +
      (ct.hours || []).map((x) => '<div class="kv"><span>' + esc(x[0]) + '</span><span class="muted">' + esc(x[1]) + '</span></div>').join('') +
      '<h3>Адрес</h3><p>' + esc(ct.address || '') + '</p>' + (ct.route ? '<p class="muted">' + esc(ct.route) + '</p>' : '') +
      '<div class="btn-row">' + btn(ct.map, '🗺 Открыть на карте') + '</div>');
    if ((tx.admin || []).length) h += fold('i-admin', '👩‍💼 Администрация', tx.admin.map((a) => '<div class="kv"><span>' + esc(a[0]) + '</span><span class="muted">' + esc(a[1]) +
      (a[2] ? '<br>' + a[2].split(' · ').map((x) => x.includes('@') ? '<a class="tel" href="mailto:' + esc(x) + '">' + esc(x) + '</a>' : /^\+/.test(x) ? tel(x, x.replace(/[^\d+]/g, '')) : esc(x)).join(' · ') : '') + '</span></div>').join(''));
    const tch = sc.teachers || {}, tk = Object.keys(tch).sort((a, c) => gradeOf(a) - gradeOf(c) || a.localeCompare(c));
    if (tk.length) h += fold('i-teachers', '🧑‍🏫 Классные руководители', tk.map((k) => '<div class="kv"><span>' + esc(classLabel(k)) + '</span><span class="muted">' + esc(tch[k]) + '</span></div>').join(''));
    return '<div class="info">' + h + '</div>';
  }

  function viewNews() {
    return (data.news || []).length ? data.news.map((p) => post(p, true)).join('') : '<div class="empty">Новостей пока нет</div>';
  }

  // «Сейчас» обновляется раз в 30 секунд, не перерисовывая всю страницу
  setInterval(() => {
    const el = document.getElementById('now');
    if (!el || !data || tab !== 'schedule') return;
    const tmp = document.createElement('div'); tmp.innerHTML = viewNow();
    if (tmp.firstChild) el.replaceWith(tmp.firstChild); else el.remove();
  }, 30000);

  function draw() {
    document.querySelectorAll('nav button').forEach((b) => b.classList.toggle('on', b.dataset.tab === tab));
    main.innerHTML = (tab === 'news' ? viewNews() : tab === 'info' ? viewInfo() : viewSchedule()) +
      '<div class="foot">Обновлено ' + fmtDate(data.generated * 1000) + (data.version ? ' · версия ' + esc(data.version) : '') + '</div>';
  }

  // просмотр картинки на весь экран
  const viewer = $('#viewer'), vimg = viewer.querySelector('img');
  function closeViewer() { viewer.classList.remove('on', 'zoom'); if (W && W.BackButton) W.BackButton.hide(); }
  function openViewer(src) {
    vimg.src = src; viewer.classList.add('on'); viewer.scrollTop = 0;
    if (W && W.BackButton) W.BackButton.show();
  }
  if (W && W.BackButton) W.BackButton.onClick(closeViewer);
  viewer.querySelector('.x').onclick = closeViewer;
  vimg.onclick = () => viewer.classList.toggle('zoom');

  document.addEventListener('click', (e) => {
    const t = e.target;
    const nav = t.closest('nav button');
    if (nav) { tab = nav.dataset.tab; try { localStorage.setItem('miniapp.tab', tab); } catch (x) { /* не важно */ } draw(); window.scrollTo(0, 0); return; }
    const dayChip = t.closest('[data-day]');
    if (dayChip) { menuDay = dayChip.dataset.day; draw(); return; }
    const sum = t.closest('[data-fold]');
    if (sum) { folds[sum.dataset.fold] = !sum.parentNode.open; return; }
    const cd = t.closest('[data-clubday]');
    if (cd) { clubDay = cd.dataset.clubday; draw(); return; }
    const eg = t.closest('[data-evgrade]');
    if (eg) { evGrade = +eg.dataset.evgrade; draw(); return; }
    if (t.closest('[data-evall]')) { evAll = true; draw(); return; }
    const ig = t.closest('[data-igrade]');
    if (ig) { infoGrade = +ig.dataset.igrade; draw(); return; }
    const myChip = t.closest('[data-mycls]');
    if (myChip) {
      const k = myChip.dataset.mycls;
      myClasses = myClasses.includes(k) ? myClasses.filter((x) => x !== k) : myClasses.concat(k).slice(-2);
      saveClasses();
      draw(); return;
    }
    const foodChip = t.closest('[data-food]');
    if (foodChip) { foodGroup = foodChip.dataset.food; try { localStorage.setItem('miniapp.food', foodGroup); } catch (x) { /* не важно */ } draw(); return; }
    const chip = t.closest('[data-cls]');
    if (chip) { cls = chip.dataset.cls; try { localStorage.setItem('miniapp.class', cls); } catch (x) { /* не важно */ } draw(); return; }
    if (t.closest('.more')) { const card = t.closest('.card'); card.querySelector('.text').classList.remove('clip'); t.remove(); return; }
    const a = t.closest('a[data-ext]');
    if (a) { e.preventDefault(); openUrl(a.getAttribute('href')); return; }
    const op = t.closest('[data-open]');
    if (op) { openUrl(op.dataset.open); return; }
    const f = t.closest('[data-file]');
    if (f) { openUrl(new URL(f.dataset.file, location.href).href); return; }
    if (t.dataset && t.dataset.post) { openUrl(t.dataset.post); return; }
    if (t.dataset && t.dataset.full && !viewer.classList.contains('on')) openViewer(t.dataset.full);
  });

  fetch('data.json?t=' + Date.now(), { cache: 'no-store' }).then((r) => r.json()).then((d) => {
    data = d;
    const ch = d.channel || {};
    if (ch.title) { $('#title').textContent = ch.title; document.title = ch.title; }
    if (ch.icon) { const l = $('#logo'); l.src = ch.icon; l.hidden = false; }
    if (ch.link) { const s = $('#sub'); s.hidden = false; s.onclick = () => openUrl(ch.link); }
    draw();
  }).catch(() => { main.innerHTML = '<div class="empty">Не удалось загрузить данные. Проверьте интернет и откройте ещё раз.</div>'; });
})();
</script>
</body>
</html>
